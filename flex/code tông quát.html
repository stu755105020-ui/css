<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
        }

        .container {
            width: 800px;
            min-height: 400px;
            margin: 50px auto;

            border: 3px solid black;

            display: flex;

            flex-direction: row;
            flex-wrap: wrap;

            justify-content: center;
            align-items: center;

            gap: 20px;

        }

        .item {
            width: 150px;
            height: 100px;

            background: orange;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
            font-weight: bold;


        }
    </style>
</head>

<body>

    <div class="container">

        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">6</div>
        <div class="item">6</div>
        <div class="item">6</div>
        <div class="item">6</div>

    </div>

</body>

</html>
